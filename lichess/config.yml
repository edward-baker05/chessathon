# lichess-bot configuration for the engine. Paths are relative to lichess/lichess-bot/,
# where `make lichess` runs lichess-bot. The token comes from LICHESS_BOT_TOKEN or lichess/token,
# never from this file. Every option not set here takes lichess-bot's default; see
# lichess/lichess-bot/config.yml.default for the full list.
token: "set LICHESS_BOT_TOKEN or write lichess/token"
url: "https://lichess.org/"

engine:
  dir: "../../cpp/build/"          # cpp/build/, which lichess/run.sh builds before starting
  name: "engine"                   # the C++ engine, a UCI binary with the network inside it
  protocol: "uci"
  ponder: true                     # search on the opponent's time; `go ponder` and ponderhit
  polyglot:
    enabled: true                  # no book: games should show the agent, not a book
  draw_or_resign:
    resign_enabled: false          # the agent reports a score now, so either of these can be enabled
    offer_draw_enabled: false
  uci_options:
    Hash: 128                      # MB per game, and `concurrency` games at once

move_overhead: 1000                # ms held back from our clock for the round trip to lichess

challenge:
  concurrency: 2                   # one game at a time, so a game gets the whole core
  accept_bot: false
  only_bot: false
  min_base: 30
  max_base: 600
  min_increment: 0
  max_increment: 10
  bullet_requires_increment: true  # bullet with no increment tests the clock more than the agent
  variants:
    - standard
    - fromPosition                 # games from a set position
  time_controls:
    - bullet
    - blitz
    - rapid
  modes:
    - casual
    - rated

greeting:
  hello: "Hi, I'm {me}, an AI engine. Good luck!"
  goodbye: "Good game!"
  hello_spectators: ""
  goodbye_spectators: ""

pgn_directory: "../games"          # lichess/games/, one PGN per game

matchmaking:
  allow_matchmaking: true          # set true to have the bot challenge other bots when idle
  challenge_initial_time:
    - 180
  challenge_increment:
    - 2
  challenge_mode: "casual"

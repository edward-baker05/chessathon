[project]
name = "chess-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "torch==2.13.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "mypy>=1.18",
    "ruff>=0.14",
    "pytest>=8.3",
    "zstandard>=0.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["tests", "tools"]

[tool.pyright]
venvPath = "."
venv = ".venv"
